<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do List App</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: "Poppins", sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
      linear-gradient(rgba(15,15,25,0.85), rgba(15,15,25,0.85)),
      url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1600&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      overflow:hidden;
      color:white;
    }

    /* Background Glow */
    .glow1,
    .glow2{
      position:absolute;
      border-radius:50%;
      filter:blur(100px);
      z-index:0;
    }

    .glow1{
      width:250px;
      height:250px;
      background:#ff7b00;
      top:50px;
      right:80px;
      opacity:0.4;
    }

    .glow2{
      width:300px;
      height:300px;
      background:#5b5bff;
      bottom:30px;
      left:50px;
      opacity:0.3;
    }

    .todo-container{
      width:420px;
      backdrop-filter: blur(18px);
      background: rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:25px;
      padding:30px;
      box-shadow:0 8px 40px rgba(0,0,0,0.4);
      position:relative;
      z-index:1;
    }

    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .top-bar h1{
      font-size:28px;
      font-weight:600;
    }

    .date{
      font-size:14px;
      color:#d3d3d3;
    }

    .input-box{
      display:flex;
      gap:10px;
      margin-bottom:25px;
    }

    .input-box input{
      flex:1;
      padding:14px;
      border:none;
      outline:none;
      border-radius:14px;
      background:rgba(255,255,255,0.08);
      color:white;
      font-size:15px;
    }

    .input-box input::placeholder{
      color:#cfcfcf;
    }

    .input-box button{
      border:none;
      padding:14px 18px;
      border-radius:14px;
      background:linear-gradient(135deg,#ff8a00,#ff5e00);
      color:white;
      font-size:15px;
      cursor:pointer;
      transition:0.3s;
    }

    .input-box button:hover{
      transform:scale(1.05);
    }

    ul{
      list-style:none;
      max-height:400px;
      overflow-y:auto;
    }

    ul::-webkit-scrollbar{
      width:5px;
    }

    ul::-webkit-scrollbar-thumb{
      background:#777;
      border-radius:10px;
    }

    li{
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:rgba(255,255,255,0.06);
      padding:15px;
      border-radius:15px;
      margin-bottom:14px;
      transition:0.3s;
      animation:fadeIn 0.4s ease;
    }

    li:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,0.09);
    }

    .task-text{
      flex:1;
      cursor:pointer;
      font-size:15px;
    }

    .completed .task-text{
      text-decoration:line-through;
      opacity:0.5;
    }

    .actions{
      display:flex;
      gap:8px;
    }

    .complete-btn,
    .delete-btn{
      border:none;
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
      color:white;
      transition:0.3s;
    }

    .complete-btn{
      background:#28c76f;
    }

    .delete-btn{
      background:#ff4d4d;
    }

    .complete-btn:hover,
    .delete-btn:hover{
      transform:scale(1.1);
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:500px){
      .todo-container{
        width:92%;
        padding:20px;
      }

      .top-bar h1{
        font-size:22px;
      }
    }

  </style>
</head>

<body>

  <div class="glow1"></div>
  <div class="glow2"></div>

  <div class="todo-container">

    <div class="top-bar">
      <div>
        <h1>TO-DO LIST</h1>
        <div class="date" id="date"></div>
      </div>
    </div>

    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Add your task...">
      <button onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>

  </div>

  <script>

    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");

    // Date
    const today = new Date();
    document.getElementById("date").innerHTML =
      today.toDateString();

    // Load Tasks
    window.onload = () => {
      loadTasks();
    };

    // Add Task
    function addTask(){

      const taskText = taskInput.value.trim();

      if(taskText === ""){
        alert("Please enter a task");
        return;
      }

      createTask(taskText);

      saveTasks();

      taskInput.value = "";
    }

    // Create Task
    function createTask(taskText, completed = false){

      const li = document.createElement("li");

      if(completed){
        li.classList.add("completed");
      }

      const span = document.createElement("span");
      span.classList.add("task-text");
      span.innerText = taskText;

      const actions = document.createElement("div");
      actions.classList.add("actions");

      // Complete Button
      const completeBtn = document.createElement("button");
      completeBtn.classList.add("complete-btn");
      completeBtn.innerHTML = "✓";

      completeBtn.onclick = () => {
        li.classList.toggle("completed");
        saveTasks();
      };

      // Delete Button
      const deleteBtn = document.createElement("button");
      deleteBtn.classList.add("delete-btn");
      deleteBtn.innerHTML = "🗑";

      deleteBtn.onclick = () => {
        li.remove();
        saveTasks();
      };

      actions.appendChild(completeBtn);
      actions.appendChild(deleteBtn);

      li.appendChild(span);
      li.appendChild(actions);

      taskList.appendChild(li);
    }

    // Save Tasks
    function saveTasks(){

      const tasks = [];

      document.querySelectorAll("#taskList li").forEach(li => {

        tasks.push({
          text: li.querySelector(".task-text").innerText,
          completed: li.classList.contains("completed")
        });

      });

      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    // Load Tasks
    function loadTasks(){

      const savedTasks =
      JSON.parse(localStorage.getItem("tasks")) || [];

      savedTasks.forEach(task => {
        createTask(task.text, task.completed);
      });

    }

    // Enter Key Support
    taskInput.addEventListener("keypress", (e) => {
      if(e.key === "Enter"){
        addTask();
      }
    });

  </script>

</body>
</html>
